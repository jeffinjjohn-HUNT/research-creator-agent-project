<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b2a30'/%3E%3Cpath d='M16 6l2.2 6.8L25 15l-6.8 2.2L16 24l-2.2-6.8L7 15l6.8-2.2z' fill='%23ffd75e'/%3E%3C/svg%3E">
<style>
  :root {
    /* survey paper + spruce ink, with a highlighter-yellow for anything cited */
    --bg:#eaefec; --panel:#fcfdfc; --ink:#0e2a2e; --ink2:#36504f; --mute:#617775; --line:#d3dcd8; --line2:#bccac5;
    --p:#0b7a75; --p2:#0e8f86; --psoft:#dcefeb; --hl:#ffd75e; --grid:rgba(14,42,46,.05);
    --green:#2c8a3e; --greensoft:#e0f2e3; --amber:#a96a00; --ambersoft:#fff1d1; --red:#c93a49; --redsoft:#fbe9eb; --cyan:#0b86a3; --cyansoft:#dff2f7;
    --shadow:0 1px 0 rgba(14,42,46,.04);
    --font:"Bricolage Grotesque","Segoe UI Variable Text","Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
    --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:Consolas,"Cascadia Code",monospace;
  }
  [data-theme="dark"] {
    --bg:#061418; --panel:#0c2126; --ink:#e7f2ef; --ink2:#bcd2cd; --mute:#84a39d; --line:#1a3a40; --line2:#27505a;
    --p:#5fd6c8; --p2:#2fb3a8; --psoft:#11343b; --hl:#f2c14e; --grid:rgba(95,214,200,.055);
    --greensoft:#10301f; --green:#62d58a; --ambersoft:#33270f; --amber:#f2b254;
    --redsoft:#35161b; --red:#ff7b88; --cyansoft:#0d2b35; --cyan:#4cc9e6;
    --shadow:0 1px 0 rgba(0,0,0,.3);
  }
  :focus-visible { outline:2px solid var(--p); outline-offset:2px; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.55 var(--font); font-optical-sizing:auto; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  /* survey grid under the moving source map (canvas#bg) */
  body::before { content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(1000px 520px at 92% -8%, color-mix(in srgb,var(--p) 13%, transparent), transparent);
    background-size:56px 56px, 56px 56px, auto; }
  #bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  button { font:inherit; cursor:pointer; } svg { display:block; flex:none; }
  a { color:var(--p); }

  /* ---------- top navigation ---------- */
  .nav { position:sticky; top:0; z-index:20; height:66px; display:flex; align-items:center; gap:28px; padding:0 32px;
    background:color-mix(in srgb,var(--panel) 86%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .logo { display:flex; align-items:center; gap:11px; font-weight:700; font-size:18px; letter-spacing:-.025em; cursor:pointer; }
  .logo i { width:34px; height:34px; border-radius:9px; background:#0b2a30; display:grid; place-items:center; color:#ffd75e; }
  .links { display:flex; gap:4px; }
  .links a { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; color:var(--mute); font-weight:600; text-decoration:none; font-size:14px; cursor:pointer; }
  .links a:hover { color:var(--ink); background:var(--bg); }
  .links a.on { color:var(--p); background:var(--psoft); }
  .grow { flex:1; }
  .mode { font-size:12px; font-weight:600; color:var(--mute); background:var(--bg); border:1px solid var(--line); padding:5px 12px; border-radius:99px; }
  .iconbtn { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); background:var(--panel); color:var(--ink2); border-radius:11px; }
  .iconbtn:hover { border-color:var(--p); color:var(--p); }
  .logo { white-space:nowrap; }
  @media (max-width:760px){ .nav{padding:0 14px; gap:8px;} .mode{display:none;} .links a span{display:none;} .logo{font-size:15px; gap:8px;} .logo i{width:30px;height:30px;} }

  .page { max-width:1180px; margin:0 auto; padding:34px 32px 90px; }
  @media (max-width:760px){ .page{padding:22px 14px 70px;} }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:26px; }
  .head h1 { margin:0; font-size:36px; line-height:1.08; font-weight:700; letter-spacing:-.035em; }
  .head p { margin:6px 0 0; color:var(--mute); }
  .head h1, .head p { text-shadow:0 0 14px var(--bg), 0 0 5px var(--bg); }
  .card { background:color-mix(in srgb,var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:var(--shadow); }
  .card h2 { margin:0 0 4px; font-size:17px; font-weight:700; letter-spacing:-.01em; }
  .sub { color:var(--mute); font-size:13.5px; }

  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:9px; border:0; padding:12px 22px; border-radius:9px; font-weight:650; color:#fff;
    background:var(--p); box-shadow:none; transition:transform .1s, filter .1s; }
  .btn:hover { filter:brightness(1.08); transform:translateY(-1px); } .btn:disabled { opacity:.5; transform:none; cursor:not-allowed; }
  [data-theme="dark"] .btn { color:#04242a; }
  .ghost { display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line2); color:var(--ink2); padding:8px 14px; border-radius:8px; font-weight:600; font-size:13.5px; text-decoration:none; }
  .ghost:hover { border-color:var(--p); color:var(--p); }
  .linkbtn { background:none; border:0; color:var(--mute); padding:6px; border-radius:8px; } .linkbtn:hover { color:var(--red); background:var(--redsoft); }

  /* stats */
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-bottom:22px; background:color-mix(in srgb,var(--panel) 92%, transparent); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  @media (max-width:900px){ .stats{grid-template-columns:repeat(2,1fr);} }
  .stat { display:flex; gap:14px; align-items:center; padding:20px 22px; background:none; border:0; border-radius:0; border-left:1px solid var(--line); }
  .stat:first-child { border-left:0; }
  .stat .tile { width:auto; height:auto; background:none; color:var(--p); }
  .stat .t-a { color:var(--amber); } .stat .t-g { color:var(--green); } .stat .t-c { color:var(--cyan); }
  .tile { width:50px; height:50px; border-radius:15px; display:grid; place-items:center; flex:none; }
  .t-p { background:var(--psoft); color:var(--p); } .t-g { background:var(--greensoft); color:var(--green); }
  .t-a { background:var(--ambersoft); color:var(--amber); } .t-c { background:var(--cyansoft); color:var(--cyan); } .t-r { background:var(--redsoft); color:var(--red); }
  .num { font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1; }
  .lbl { color:var(--mute); font-size:13px; font-weight:500; margin-top:5px; }

  /* quick start */
  .quick { display:grid; grid-template-columns:1.3fr 1fr; gap:22px; margin-bottom:22px; }
  @media (max-width:900px){ .quick{grid-template-columns:1fr;} }
  .hero { color:#eaf6f3; border:0; position:relative; overflow:hidden;
    background:repeating-radial-gradient(circle at 94% 6%, transparent 0 24px, rgba(255,255,255,.06) 24px 25px), linear-gradient(140deg,#0a2a30,#0d3b3d); }
  .hero h2 { font-size:26px; letter-spacing:-.025em; color:#fff; line-height:1.15; } .hero .sub { color:rgba(234,246,243,.8); font-size:14.5px; max-width:44ch; }
  .qrow { display:flex; gap:10px; margin-top:18px; position:relative; z-index:1; flex-wrap:wrap; }
  .qrow input { flex:1; min-width:200px; border:0; background:#fff; color:#0e2a2e; padding:13px 16px; border-radius:9px; font:inherit; }
  .qrow input:focus { outline:3px solid #ffd75e; }
  .qrow .btn, [data-theme="dark"] .qrow .btn { background:#ffd75e; color:#1a1405; box-shadow:none; }
  .feat { display:grid; gap:14px; }
  .fi { display:flex; gap:14px; align-items:flex-start; } .fi b { display:block; font-size:14.5px; } .fi span { color:var(--mute); font-size:13px; }
  .fi .tile { width:40px; height:40px; border-radius:12px; }

  /* table */
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; font-size:13px; color:var(--mute); font-weight:600; padding:0 12px 12px; }
  td { padding:14px 12px; border-top:1px solid var(--line); vertical-align:middle; }
  tr.row { cursor:pointer; } tr.row:hover td { background:var(--bg); }
  td .nm { font-weight:600; max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:99px; font-size:12px; font-weight:700; background:var(--psoft); color:var(--p); text-transform:capitalize; white-space:nowrap; }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .badge.completed { background:var(--greensoft); color:var(--green); } .badge.completed_with_warnings, .badge.needs_input { background:var(--ambersoft); color:var(--amber); }
  .badge.failed { background:var(--redsoft); color:var(--red); }
  .empty { text-align:center; color:var(--mute); padding:40px 10px; }

  /* new research page */
  .two { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:980px){ .two{grid-template-columns:1fr;} }
  label.f { display:block; font-weight:700; font-size:13px; color:var(--ink2); margin:20px 0 7px; } label.f.first { margin-top:0; }
  input.in, textarea.in, select.in { width:100%; padding:12px 14px; border:1.5px solid var(--line2); border-radius:9px; font:inherit; background:var(--panel); color:var(--ink); transition:.12s; }
  textarea.in { min-height:140px; resize:vertical; line-height:1.55; }
  .in::placeholder { color:#a0a6c2; }
  .in:focus { outline:0; border-color:var(--p); box-shadow:0 0 0 4px color-mix(in srgb,var(--p) 18%, transparent); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width:640px){ .row2{grid-template-columns:1fr;} }
  .hint { color:var(--mute); font-size:12.5px; margin-top:7px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border:1.5px solid var(--line2); border-radius:99px; background:var(--panel); font-size:13px; font-weight:600; color:var(--ink2); cursor:pointer; user-select:none; }
  .chip:hover { border-color:var(--p); }
  .chip input { display:none; }
  .chip:has(input:checked) { background:var(--psoft); border-color:var(--p); color:var(--p); }
  .chip.sample { border-style:dashed; color:var(--p); }
  .err { color:var(--red); font-weight:600; font-size:13.5px; }

  /* workspace */
  .ws { display:grid; grid-template-columns:330px minmax(0,1fr); gap:22px; align-items:start; }
  @media (max-width:980px){ .ws{grid-template-columns:1fr;} }
  .steps { display:grid; gap:0; margin-top:18px; }
  .st { display:grid; grid-template-columns:32px 1fr; gap:12px; position:relative; padding-bottom:18px; }
  .st:last-child { padding-bottom:0; }
  .st::before { content:""; position:absolute; left:15px; top:32px; bottom:0; width:2px; background:var(--line2); }
  .st:last-child::before { display:none; } .st.done::before { background:var(--green); }
  .dot { width:32px; height:32px; border-radius:50%; display:grid; place-items:center; border:2px solid var(--line2); background:var(--panel); color:var(--mute); font-size:12px; font-weight:700; z-index:1; }
  .st.done .dot { background:var(--green); border-color:var(--green); color:#fff; }
  .st.active .dot { border-color:var(--p); color:var(--p); animation:pulse 1.3s infinite; }
  .st.skip .dot { background:var(--bg); }
  @keyframes pulse { 50% { box-shadow:0 0 0 7px color-mix(in srgb,var(--p) 20%, transparent); } }
  .st b { display:block; font-size:14px; line-height:32px; } .st small { display:block; color:var(--mute); font-size:12.5px; margin-top:-6px; }
  .st.skip b { color:var(--mute); }
  .tabs { display:flex; gap:6px; padding:5px; background:var(--bg); border-radius:14px; margin-bottom:20px; overflow-x:auto; }
  .tabs button { flex:1; background:none; border:0; padding:9px 16px; border-radius:10px; color:var(--mute); font-weight:700; white-space:nowrap; }
  .tabs button:hover { color:var(--ink); } .tabs button.on { background:var(--panel); color:var(--p); box-shadow:0 2px 8px rgba(15,21,53,.1); }
  .sec { padding:20px 0; border-bottom:1px solid var(--line); } .sec:first-child { padding-top:2px; } .sec:last-child { border-bottom:0; padding-bottom:0; }
  .sec h3 { margin:0 0 8px; font-size:17px; font-weight:700; display:flex; flex-wrap:wrap; align-items:center; gap:8px; letter-spacing:-.01em; }
  .sec .body { font-family:var(--serif); font-size:16.5px; line-height:1.75; color:var(--ink2); white-space:pre-wrap; }
  .cite { padding:0 7px; border-radius:3px; background:linear-gradient(transparent 14%, var(--hl) 14%, var(--hl) 94%, transparent 94%); color:#1a1405; font:700 11.5px/20px var(--font); }
  .tag { padding:0 8px; border-radius:6px; background:var(--bg); color:var(--mute); font:600 12px/20px var(--font); }
  .item { border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .item .ttl { font-weight:600; } .item a { word-break:break-all; font-size:13px; text-decoration:none; } .item a:hover { text-decoration:underline; }
  .id { font:700 12px var(--mono); color:var(--mute); margin-right:8px; } .meta { color:var(--mute); font-size:13px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:7px; font-size:12px; font-weight:700; margin-right:8px; background:var(--psoft); color:var(--p); vertical-align:1px; }
  .pill.supported { background:var(--greensoft); color:var(--green); } .pill.partly_supported { background:var(--ambersoft); color:var(--amber); }
  .pill.contradicted { background:var(--redsoft); color:var(--red); } .pill.not_verified, .pill.opinion { background:var(--bg); color:var(--mute); }
  .pill.youtube { background:#ffe6e6; color:#d02020; } .pill.reddit { background:#ffeadb; color:#cc4a00; } .pill.x { background:#ececf2; color:#111; }
  .pill.news { background:var(--cyansoft); color:var(--cyan); } .pill.web { background:var(--greensoft); color:var(--green); }
  .bar { height:6px; background:var(--line); border-radius:9px; overflow:hidden; width:110px; display:inline-block; vertical-align:middle; } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--p),var(--hl)); }
  .draft textarea { min-height:150px; margin:12px 0; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .note { background:var(--ambersoft); border:1px solid color-mix(in srgb,var(--amber) 35%, transparent); border-radius:14px; padding:16px 18px; }
  .note b { display:block; margin-bottom:4px; }
  .working { text-align:center; padding:60px 20px; color:var(--mute); }
  .spin { width:38px; height:38px; border-radius:50%; border:4px solid var(--psoft); border-top-color:var(--p); margin:0 auto 16px; animation:sp .9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .back { display:inline-flex; align-items:center; gap:6px; color:var(--mute); font-weight:600; font-size:13.5px; margin-bottom:14px; cursor:pointer; background:none; border:0; padding:0; } .back:hover { color:var(--p); }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink); max-width:560px; width:92%; padding:26px; box-shadow:0 24px 60px rgba(0,0,0,.3); }
  dialog::backdrop { background:rgba(8,10,28,.55); backdrop-filter:blur(3px); } dialog h3 { margin:0 0 4px; font-size:19px; }
  ul.log { list-style:none; margin:10px 0 0; padding:12px 14px; background:var(--bg); border-radius:12px; font:12.5px/1.65 var(--mono); color:var(--mute); } ul.log .warning { color:var(--amber); } ul.log .error { color:var(--red); }
  details summary { cursor:pointer; color:var(--mute); font-size:13px; margin-top:18px; font-weight:600; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<nav class="nav">
  <div class="logo" id="logo"><i id="logoIcon"></i>Research Studio</div>
  <div class="links">
    <a id="nDash" data-go="#/"><span>Dashboard</span></a>
    <a id="nNew" data-go="#/new"><span>New research</span></a>
  </div>
  <div class="grow"></div>
  <div class="mode" id="mode"></div>
  <button class="iconbtn" id="voiceBtn" title="Voice profile"></button>
  <button class="iconbtn" id="themeBtn" title="Toggle dark mode"></button>
</nav>
<div class="page" id="view"></div>

<dialog id="voiceDlg">
  <h3>Voice profile</h3>
  <div class="sub">Drafts follow these rules. Only add text you are happy for the app to use as style examples.</div>
  <label class="f" for="vRules">Style rules (one per line)</label>
  <textarea class="in" id="vRules" placeholder="Short sentences&#10;No emojis&#10;Friendly but direct"></textarea>
  <label class="f" for="vExamples">Example posts of yours (separate with a blank line)</label>
  <textarea class="in" id="vExamples"></textarea>
  <div class="actions" style="margin-top:20px"><button class="btn" id="vSave">Save</button><button class="ghost" id="vClose">Cancel</button><span id="vMsg" class="meta"></span></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const ICONS = {
  plus:"M12 5v14M5 12h14", check:"M20 6L9 17l-5-5", clock:"M12 22a10 10 0 100-20 10 10 0 000 20zM12 6v6l4 2",
  alert:"M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z",
  file:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zM14 2v6h6M8 13h8M8 17h8",
  grid:"M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z", mic:"M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3zM19 10v2a7 7 0 01-14 0v-2M12 19v3",
  moon:"M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z",
  sun:"M12 17a5 5 0 100-10 5 5 0 000 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4",
  search:"M11 19a8 8 0 100-16 8 8 0 000 16zM21 21l-4.3-4.3", trash:"M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6", copy:"M9 9h11v11H9zM5 15H4V4h11v1",
  download:"M12 3v12M7 10l5 5 5-5M5 21h14", spark:"M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z",
  shield:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z", edit:"M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z",
  arrow:"M5 12h14M12 5l7 7", back:"M15 18l-6-6 6-6", layers:"M12 2l10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5", link:"M10 13a5 5 0 007.5.5l3-3a5 5 0 00-7-7l-1.7 1.7M14 11a5 5 0 00-7.5-.5l-3 3a5 5 0 007 7l1.7-1.7"
};
function icon(name, size = 20, sw = 2) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", sw);
  s.setAttribute("stroke-linecap", "round"); s.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", ICONS[name]); s.append(p); return s;
}
// Safe DOM builder: all text goes through text nodes, never innerHTML (content comes from the web / the model).
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n[k] = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
}
const pretty = (s) => String(s).replace(/_/g, " ");
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };

    const q = r.quality || { issues: [], passed: true, independent_categories: 0 };
    pane.append(el("div", { class: "item" }, el("span", { class: "pill " + (q.passed ? "supported" : "contradicted") }, q.passed ? "Checks passed" : "Errors found"), `${q.independent_categories} independent source categories`));
    q.issues.forEach(i => pane.append(el("div", { class: "item" }, el("span", { class: "pill " + (i.severity === "error" ? "contradicted" : i.severity === "warning" ? "partly_supported" : "") }, i.severity), i.message)));
    if (!q.issues.length) pane.append(el("div", { class: "empty" }, "No issues."));
  }
}

/* ---------- voice profile ---------- */
$("voiceBtn").onclick = async () => {
  try { const v = await api("/voice").then(r => r.json()); $("vRules").value = (v.style_rules || []).join("\n"); $("vExamples").value = (v.example_texts || []).join("\n\n"); } catch {}
  $("vMsg").textContent = ""; $("voiceDlg").showModal();
};
$("vClose").onclick = () => $("voiceDlg").close();
$("vSave").onclick = async () => {
  try { await api("/voice", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({
      style_rules: $("vRules").value.split("\n").map(s => s.trim()).filter(Boolean), example_texts: $("vExamples").value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean) }) });
    $("vMsg").textContent = "Saved"; setTimeout(() => $("voiceDlg").close(), 600); } catch (e) { $("vMsg").textContent = e.message; }
};
route();
</script>
